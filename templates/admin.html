<!DOCTYPE html>
<html lang="es">

<head>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icono2.png') }}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel de Administración</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:#f4f6f9;

}

/* Barra superior */

header{

background:#1f2937;
color:white;
padding:20px 40px;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:0 3px 10px rgba(0,0,0,.2);

}

header h1{

font-size:28px;

}

.usuario{

font-size:18px;

}

/* Contenedor */

.container{

width:95%;
margin:auto;
margin-top:40px;

}

/* Tarjetas */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;

}

.card{

background:white;
padding:25px;

border-radius:12px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card h2{

color:#555;

margin-bottom:10px;

}

.card p{

font-size:35px;
font-weight:bold;
color:#e67e22;

}

/* Tabla */

table{

width:100%;
border-collapse:collapse;
background:white;

border-radius:12px;
overflow:hidden;

box-shadow:0 5px 20px rgba(0,0,0,.15);

}

th{

background:#1f2937;
color:white;
padding:18px;

}

td{

padding:15px;
text-align:center;
border-bottom:1px solid #ddd;

}

tr:hover{

background:#f1f1f1;

}

/* Botones */

.btn{

padding:10px 18px;

text-decoration:none;

border-radius:8px;

font-weight:bold;

color:white;

}

.aceptar{

background:#28a745;

}

.cancelar{

background:#dc3545;

}

.aceptar:hover{

background:#1f8a39;

}

.cancelar:hover{

background:#b51f2d;

}

.estado{

font-weight:bold;

}

</style>

</head>

<body>

<header>

<h1>🍽 Panel de Administración</h1>

<div class="usuario">

Administrador

</div>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2>Total Reservas</h2>

<p>{{ reservas|length }}</p>

</div>

<div class="card">

<h2>Estado</h2>

<p>Activas</p>

</div>

<div class="card">

<h2>Restaurante</h2>

<p>La Mesa Dorada</p>

</div>

</div>

<table>

<tr>

<th>ID</th>
<th>Cliente</th>
<th>Correo</th>
<th>Fecha</th>
<th>Hora</th>
<th>Personas</th>
<th>Estado</th>
<th>Acciones</th>

</tr>

{% for r in reservas %}

<tr>

<td>{{r[0]}}</td>

<td>{{r[1]}}</td>

<td>{{r[2]}}</td>

<td>{{r[4]}}</td>

<td>{{r[5]}}</td>

<td>{{r[6]}}</td>

<td class="estado">{{r[8]}}</td>

<td>

<a class="btn aceptar" href="/aceptar/{{r[0]}}">

Aceptar


</a>


<form action="/rechazar/{{ r[0] }}" method="POST" style="display:inline;">

    <button type="submit" class="btn cancelar">
         Rechazar
    </button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
